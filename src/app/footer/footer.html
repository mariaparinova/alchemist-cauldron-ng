@let isGameActive = status() === 'playing' || status() === 'paused';

<footer class="footer">
  <button class="button icon-button" type="button" aria-label="Help">
    <img class="icon" src="/assets/icons/help.svg" alt="Help" />
  </button>

  <button
    class="button primary"
    type="button"
    (click)="gameService.startGame()"
    [hidden]="isGameActive"
  >
    play
  </button>
  <button
    class="button primary"
    type="button"
    (click)="gameService.brew()"
    [hidden]="!isGameActive"
    [disabled]="!gameService.canBrew()"
  >
    brew
  </button>

  <button class="button icon-button" type="button" aria-label="Settings">
    <img class="icon" src="/assets/icons/settings.svg" alt="Settings" />
  </button>
</footer>
