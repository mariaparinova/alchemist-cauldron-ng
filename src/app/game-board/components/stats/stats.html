@let cauldronStats = stats();

<div class="stat">
  <img class="icon" src="/assets/icons/temperature.svg" alt="Temperature" />
  <span class="stat-label">Temperature</span>
  <span class="stat-value">{{ cauldronStats.temperature }}</span>
</div>
<div class="stat">
  <img class="icon" src="/assets/icons/density.svg" alt="Density" />
  <span class="stat-label">Density</span>
  <span class="stat-value">{{ cauldronStats.density }}</span>
</div>
<div class="stat">
  <img class="icon" src="/assets/icons/magic-power.svg" alt="Magic Power" />
  <span class="stat-label">Magic Power</span>
  <span class="stat-value">{{ cauldronStats.magicPower }}</span>
</div>
