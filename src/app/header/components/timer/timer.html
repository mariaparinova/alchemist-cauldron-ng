@let isGameActive = gameService.status() === 'playing' || gameService.status() === 'paused';

<div class="pause-container">
  <button
    type="button"
    class="button icon-button"
    [hidden]="!isGameActive"
    (click)="gameService.pauseGame()"
    aria-label="Pause"
  >
    <img class="icon icon-button-image" src="/assets/icons/pause.svg" alt="Pause" />
  </button>
</div>

<div class="timer-container">
  <img class="icon timer-icon" src="/assets/icons/clock.svg" alt="Timer" />
  <div class="timer-info">
    <div class="timer">{{ formatTime(gameService.timeLeft()) }}</div>
    <div class="timer-bar">
      <div class="timer-bar-fill"></div>
    </div>
  </div>
</div>
