<div class="pause-container">
  <button type="button" class="button icon-button" hidden aria-label="Pause">
    <img class="icon icon-button-image" src="/assets/icons/pause.svg" alt="Pause" />
  </button>
</div>

<div class="timer-container">
  <img class="icon timer-icon" src="/assets/icons/clock.svg" alt="Timer" />
  <div class="timer-info">
    <div class="timer">00:00</div>
    <div class="timer-bar">
      <div class="timer-bar-fill"></div>
    </div>
  </div>
</div>
